<script>
/* =====================================================================
   Inhalte: Die Wörter, Übungen und Einstellungen stehen in eigenen Dateien
     einstellungen.js   – Punkte, Berg, Mischung, Tempo, Sätze des Einhorns
     inhalte-abc.js     – alle Karten des Spiels ABC
     inhalte-english.js – alle Karten des Spiels English
   Hier werden Fehler beim Laden dieser Dateien gesammelt.
   ===================================================================== */
window.INHALT_FEHLER = [];
window.addEventListener("error", function (e) {
  var t = e.target;
  if (t && t.tagName === "SCRIPT") {
    INHALT_FEHLER.push({ datei: (t.getAttribute("src") || "").split("/").pop(), text: "Die Datei wurde nicht gefunden." });
    return;
  }
  var datei = String(e.filename || "").split("/").pop().split("?")[0];
  if (/^(einstellungen|inhalte-abc|inhalte-english)\.js$/.test(datei)) INHALT_FEHLER.push({ datei: datei, zeile: e.lineno, text: String(e.message || "Fehler").replace(/^Uncaught /, "") });
}, true);
</script>
<script src="einstellungen.js"></script>
<script src="inhalte-abc.js"></script>
<script src="inhalte-english.js"></script>
<script>
/* Inhalte prüfen. Fehlerhafte Karten werden übersprungen; ist eine ganze Datei kaputt,
   spielt die App mit der zuletzt funktionierenden Fassung weiter (auf dem Gerät gesichert). */
window.INHALT_HINWEISE = [];   // für Einstellungen › Bibliothek
window.INHALT_FATAL = false;
(function () {
  var SICHERUNG = "einhornABC.inhalte";
  var PFLICHT = ["kartenProRunde", "bewertung", "stationen", "mischung", "auswahl", "trainingRichtigBisFertig", "sprechversuche",
    "pauseNachNochmalMs", "hoerDauerMs", "lautVarianten", "enAutoVorlesen", "naechsteKarteMs", "szeneDauerMs", "tempo",
    "stimmhoehe", "lobDe", "lobEn", "szenenLob", "namensVorschlaege"];
  var hin = INHALT_HINWEISE;
  function fehlerVon(datei) { return INHALT_FEHLER.filter(function (f) { return f.datei === datei; }); }
  function fehlerText(f) { return f.datei + (f.zeile ? ", Zeile " + f.zeile : "") + ": " + f.text; }
  var sicherung = null;
  try { var roh = localStorage.getItem(SICHERUNG); if (roh) sicherung = JSON.parse(roh, function (k, v) { return v === "__unendlich__" ? Infinity : v; }); } catch (e) { sicherung = null; }
  var fatal = [];
  function teil(datei, wert, pruef, schluessel) {
    var fe = fehlerVon(datei);
    if (fe.length || !pruef(wert)) {
      var grund = fe.length ? fe.map(fehlerText).join(" · ") : datei + ": Der Inhalt ist unvollständig.";
      if (sicherung && sicherung[schluessel]) { hin.push(grund + " – die App benutzt bis zur Korrektur die zuletzt funktionierende Fassung."); return sicherung[schluessel]; }
      fatal.push(grund); return null;
    }
    return wert;
  }
  var cfg = teil("einstellungen.js", window.CONFIG, function (c) { return c && typeof c === "object" && Array.isArray(c.stationen) && Array.isArray(c.bewertung); }, "config");
  if (cfg) {
    var fehlt = PFLICHT.filter(function (k) { return !(k in cfg); });
    if (fehlt.length) {
      if (sicherung && sicherung.config) { fehlt.forEach(function (k) { cfg[k] = sicherung.config[k]; }); hin.push("einstellungen.js: Es fehlt " + fehlt.join(", ") + " – dafür gilt der zuletzt funktionierende Wert."); }
      else fatal.push("einstellungen.js: Es fehlt " + fehlt.join(", ") + ".");
    }
  }
  var abc = teil("inhalte-abc.js", window.INHALTE_ABC, Array.isArray, "abc");
  var en = teil("inhalte-english.js", window.INHALTE_ENGLISH, Array.isArray, "en");
  window.CONFIG = cfg; 
  if (fatal.length || !cfg || !abc || !en) {
    window.INHALT_FATAL = true;
    document.addEventListener("DOMContentLoaded", function () {
      document.body.innerHTML = '<div style="font:17px/1.5 ui-rounded,system-ui,sans-serif;max-width:620px;margin:40px auto;padding:0 20px;color:#4A3A48">'
        + '<p style="font-size:48px;margin:0">🦄🔧</p><h1 style="font-size:24px">Einhorn-ABC braucht eine kleine Reparatur</h1>'
        + '<p>In einer Inhaltsdatei steckt ein Fehler. Bitte die Datei auf GitHub öffnen und die genannte Zeile prüfen (oft fehlt ein Komma oder ein Anführungszeichen). Danach die App neu öffnen.</p><ul>'
        + fatal.map(function (t) { return "<li>" + String(t).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }) + "</li>"; }).join("") + "</ul></div>";
    });
    return;
  }
  // Karten einzeln prüfen
  var ids = {};
  function karten(liste, datei, spiel) {
    var aus = [];
    liste.forEach(function (k, i) {
      var nr = "Karte " + (i + 1) + (k && k.id ? " („" + k.id + "“)" : "");
      var fehlt = [];
      if (!k || typeof k !== "object") { hin.push(datei + ": " + nr + " ist keine Karte und wurde übersprungen."); return; }
      if (typeof k.id !== "string" || !k.id) fehlt.push("id");
      if (["E", "M", "S"].indexOf(k.stufe) < 0) fehlt.push("stufe");
      if (spiel === "de") {
        if (["buchstabe", "laut"].indexOf(k.typ) < 0) fehlt.push("typ");
        if (typeof k.zeichen !== "string" || !k.zeichen) fehlt.push("zeichen");
        if (k.woerter != null && !(Array.isArray(k.woerter) && k.woerter.every(function (w) { return Array.isArray(w) && typeof w[0] === "string" && w[0]; }))) fehlt.push("woerter");
      } else {
        if (["wort", "satz"].indexOf(k.typ) < 0) fehlt.push("typ");
        if (typeof k.text !== "string" || !k.text) fehlt.push("text");
        if (k.de == null) k.de = "";
        if (k.bild == null) k.bild = "";
      }
      if (fehlt.length) { hin.push(datei + ": " + nr + " wurde übersprungen – bitte prüfen: " + fehlt.join(", ") + "."); return; }
      if (ids[k.id]) { hin.push(datei + ": " + nr + " wurde übersprungen – die id gibt es schon."); return; }
      ids[k.id] = true; k.teil = spiel; aus.push(k);
    });
    return aus;
  }
  window.INHALTE_ABC = karten(abc, "inhalte-abc.js", "de");
  window.INHALTE_ENGLISH = karten(en, "inhalte-english.js", "en");
  window.BIBLIOTHEK = INHALTE_ABC.concat(INHALTE_ENGLISH);
  // Funktionierende Fassung auf dem Gerät sichern (nur wenn sich etwas geändert hat)
  try {
    var neu = JSON.stringify({ config: cfg, abc: INHALTE_ABC, en: INHALTE_ENGLISH }, function (k, v) { return v === Infinity ? "__unendlich__" : v; });
    if (localStorage.getItem(SICHERUNG) !== neu) localStorage.setItem(SICHERUNG, neu);
  } catch (e) { /* Speicher gesperrt */ }
})();
</script>

:root {
  --bg: #F3D5D8;
  --flaeche: #E8B4BA;
  --akzent: #C98A93;
  --flieder: #D9C8EE;
  --mint: #CDEFE3;
  --himmel: #CFE6F7;
  --gold: #E9C46A;
  --text: #4A3A48;
  --weiss: #FFFCFD;
  --gruen: #59B887;
  --gruen-d: #3F9A6C;
  --rot: #E58C8C;
  --rot-d: #C96B6B;
  --markierung: #D63E7E;
  --silbe1: #2F6FD0;
  --silbe2: #D83A3A;
  --schatten: 0 5px 0 rgba(201, 138, 147, .45), 0 10px 22px rgba(74, 58, 72, .12);
  --rund: 28px;
  --oben: calc(env(safe-area-inset-top) + 10px);
  --unten: calc(env(safe-area-inset-bottom) + 12px);
  --links: calc(env(safe-area-inset-left) + 16px);
  --rechts: calc(env(safe-area-inset-right) + 16px);
  --lernschrift: "Grundschrift", ui-rounded, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
body { position: fixed; inset: 0; }
input, textarea, select { -webkit-user-select: text; user-select: text; font: inherit; font-size: 17px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; }
svg { display: block; }
.versteckt { display: none !important; }

#app {
  position: absolute; inset: 0; overflow: hidden;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 12%, rgba(255,255,255,.6) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 78%, rgba(255,255,255,.5) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 24% 86%, rgba(255,255,255,.5) 0 2px, transparent 3px),
    radial-gradient(ellipse at 50% -10%, #FBEDEF 0%, transparent 60%),
    linear-gradient(180deg, #F6DFE2 0%, var(--bg) 45%, #EFCBD0 100%);
}

/* ===================== Bildschirme ===================== */
.screen {
  position: absolute; inset: 0; display: none; flex-direction: column;
  padding: var(--oben) var(--rechts) var(--unten) var(--links);
}
.screen.aktiv { display: flex; animation: einblenden .3s ease; }
@keyframes einblenden { from { opacity: 0; } to { opacity: 1; } }

.leiste { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 76px; flex: 0 0 auto; }
.leiste .mitte { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; min-width: 0; }

/* ===================== Knöpfe ===================== */
.knopf {
  border: none; border-radius: var(--rund); background: var(--weiss);
  box-shadow: var(--schatten); min-width: 72px; min-height: 72px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 22px; font-weight: 700; padding: 10px 18px;
  transition: transform .12s ease, box-shadow .12s ease;
}
.knopf:active, .knopf.gedrueckt { transform: translateY(3px) scale(.97); box-shadow: 0 2px 0 rgba(201,138,147,.45), 0 4px 10px rgba(74,58,72,.12); }
.knopf[disabled] { opacity: .45; }
.rund { width: 76px; height: 76px; min-width: 76px; border-radius: 50%; padding: 0; font-size: 36px; }
.knopf .ico { font-size: 1.5em; line-height: 1; }
.klein { min-height: 64px; min-width: 64px; font-size: 18px; border-radius: 22px; }

/* ===================== Einhorn-Figur ===================== */
.einhorn { width: 100%; height: 100%; overflow: visible; }
.einhorn .u-krone, .einhorn .u-brille, .einhorn .u-stirnband, .logo .u-krone, .logo .u-brille, .logo .u-stirnband { display: none; }
.einhorn.mit-krone .u-krone, .einhorn.mit-buch .u-brille, .einhorn.mit-training .u-stirnband { display: inline; }
.einhorn .u-auge { transform-box: fill-box; transform-origin: center; animation: blinzeln 5s infinite; }
@keyframes blinzeln { 0%, 93%, 100% { transform: scaleY(1); } 95%, 97% { transform: scaleY(.08); } }
.einhorn .u-schweif { transform-box: view-box; transform-origin: 84px 130px; animation: wedeln 2.6s ease-in-out infinite alternate; }
@keyframes wedeln { from { transform: rotate(-7deg); } to { transform: rotate(6deg); } }
.einhorn .u-funkel { transform-box: fill-box; transform-origin: center; animation: funkeln 2.2s ease-in-out infinite; }
@keyframes funkeln { 0%, 100% { transform: scale(.6); opacity: .5; } 50% { transform: scale(1.1); opacity: 1; } }
.einhorn .u-ganz { transform-box: view-box; transform-origin: 120px 200px; }
.einhorn .u-kopf, .einhorn .u-hals { transform-box: view-box; transform-origin: 148px 122px; }
.einhorn .u-bein { transform-box: view-box; }
.einhorn .u-bh1 { transform-origin: 95px 140px; } .einhorn .u-bh2 { transform-origin: 113px 140px; }
.einhorn .u-bv1 { transform-origin: 149px 140px; } .einhorn .u-bv2 { transform-origin: 167px 140px; }

.einhorn.huepfen .u-ganz { animation: huepfen .9s ease-out; }
@keyframes huepfen {
  0% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(4px) scale(1.04, .94); }
  40% { transform: translateY(-34px) scale(.97, 1.04); } 62% { transform: translateY(0) scale(1.03, .96); }
  75% { transform: translateY(-12px); } 100% { transform: translateY(0); }
}
.einhorn.fressen .u-kopf, .einhorn.fressen .u-hals { animation: fressen 1.1s ease-in-out 3; }
@keyframes fressen { 0%, 100% { transform: rotate(0); } 35%, 60% { transform: rotate(52deg); } 47% { transform: rotate(46deg); } }
.einhorn.schuetteln .u-ganz { animation: schuetteln .9s ease-in-out 2; }
@keyframes schuetteln { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-6deg); } 30% { transform: rotate(6deg); } 45% { transform: rotate(-5deg); } 60% { transform: rotate(5deg); } 75% { transform: rotate(-3deg); } }
.einhorn.galopp .u-ganz { animation: galoppHuepf .42s ease-in-out infinite; }
@keyframes galoppHuepf { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(-3deg); } }
.einhorn.galopp .u-bh1, .einhorn.galopp .u-bv2 { animation: beinA .42s ease-in-out infinite; }
.einhorn.galopp .u-bh2, .einhorn.galopp .u-bv1 { animation: beinB .42s ease-in-out infinite; }
@keyframes beinA { 0%, 100% { transform: rotate(24deg); } 50% { transform: rotate(-22deg); } }
@keyframes beinB { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(24deg); } }
.einhorn.nicken .u-kopf, .einhorn.nicken .u-hals { animation: nicken .5s ease-in-out infinite; }
@keyframes nicken { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(5deg); } }

/* ===================== Erster Start ===================== */
#s-intro { align-items: center; justify-content: center; gap: 12px; text-align: center; }
#s-intro .intro-einhorn { width: min(68vw, 46vh, 460px); aspect-ratio: 240/212; flex: 0 0 auto; }
.intro-rechts { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(560px, 100%); }
@media (orientation: landscape) {
  #s-intro { flex-direction: row; gap: 24px; }
  #s-intro .intro-einhorn { width: min(42vw, 70vh, 460px); }
  .intro-rechts { width: min(520px, 52vw); }
  .namensfeld input { font-size: 24px; padding: 10px 14px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .sprechblase { font-size: 17px; padding: 10px 16px; }
  .intro-rechts, .namensfeld { gap: 8px; }
  .chip:nth-child(n+4) { display: none; }
  .los-knopf { width: 120px; height: 120px; font-size: 56px; }
}
.sprechblase {
  position: relative; background: var(--weiss); border-radius: 26px; padding: 16px 22px;
  font-size: clamp(20px, 3.2vmin, 28px); font-weight: 700; box-shadow: var(--schatten); max-width: 560px;
}
.namensfeld { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(560px, 100%); }
.namensfeld input {
  width: 100%; font-size: 30px; text-align: center; padding: 14px 18px; border-radius: 22px;
  border: 3px solid var(--flaeche); background: var(--weiss); color: var(--text); outline: none; font-weight: 700;
}
.namensfeld input:focus { border-color: var(--akzent); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.chip { border: none; background: var(--flieder); border-radius: 999px; padding: 0 20px; min-height: 64px; font-size: 21px; font-weight: 700; box-shadow: 0 4px 0 rgba(160,130,200,.5); }
.chip:active { transform: translateY(2px); }
.los-knopf { width: 150px; height: 150px; border-radius: 50%; font-size: 72px; background: var(--weiss); }

/* ===================== Startbildschirm ===================== */
#s-start .inhalt {
  flex: 1; min-height: 0; display: grid; gap: 14px;
  grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "kopf" "buehne" "kacheln";
}
.titel { grid-area: kopf; display: flex; align-items: center; justify-content: center; gap: 12px; }
.titel .logo { width: clamp(56px, 10vmin, 96px); height: auto; }
.titel h1 { margin: 0; font-size: clamp(30px, 6vmin, 56px); letter-spacing: .5px; color: var(--text); }
.titel h1 span { color: var(--akzent); }
.buehne { grid-area: buehne; position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 12px; min-height: 0; min-width: 0; }
.buehne .start-einhorn { height: 100%; max-height: 420px; flex: 0 1 auto; width: min(62%, 476px); position: relative; }
.buehne .start-einhorn { display: flex; align-items: flex-end; padding-bottom: 30px; }
.buehne .start-einhorn .einhorn { width: 100%; height: auto; max-height: 100%; }
.buehne .start-einhorn .einhorn { cursor: pointer; }
.namensschild {
  position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); white-space: nowrap;
  background: var(--weiss); border-radius: 999px; padding: 6px 18px; font-weight: 800; font-size: clamp(18px, 3vmin, 26px);
  box-shadow: var(--schatten);
}
.berg-vorschau {
  height: 100%; max-height: 360px; aspect-ratio: 300/560; border: none; padding: 6px; border-radius: 24px;
  background: rgba(255,255,255,.55); box-shadow: var(--schatten);
}
.berg-vorschau svg { width: 100%; height: 100%; }
.kacheln { grid-area: kacheln; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.kachel {
  border: none; border-radius: 34px; min-height: clamp(130px, 22vmin, 220px); box-shadow: var(--schatten);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px;
  font-weight: 800; font-size: clamp(26px, 5vmin, 44px);
}
.kachel:active { transform: translateY(3px) scale(.98); }
.kachel-abc { background: linear-gradient(160deg, #FFF6F8, #F7D4DC); }
.kachel-en { background: linear-gradient(160deg, #F5FAFF, #D5E8F8); }
.kachel .abc-buchstaben { font-family: var(--lernschrift); font-size: clamp(54px, 11vmin, 104px); line-height: 1; letter-spacing: 4px; }
.kachel .abc-buchstaben b:nth-child(1) { color: #E26D96; } .kachel .abc-buchstaben b:nth-child(2) { color: #8D6CD1; } .kachel .abc-buchstaben b:nth-child(3) { color: #3FA27A; }
.kachel .flagge { width: clamp(96px, 16vmin, 150px); border-radius: 10px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
.kachel .unter { font-size: clamp(20px, 3.4vmin, 30px); }

@media (orientation: landscape) {
  #s-start .inhalt {
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "kopf kacheln" "buehne kacheln";
  }
  .kacheln { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; align-self: stretch; }
  .kachel { min-height: 0; }
}

/* ===================== Stufenwahl ===================== */
#s-stufe .inhalt { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.stufen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; width: min(980px, 100%); }
@media (orientation: portrait) and (max-width: 600px) { .stufen { grid-template-columns: minmax(0, 1fr); width: min(420px, 100%); } .stufe { min-height: clamp(96px, 16vh, 150px) !important; } }
.stufe {
  border: none; border-radius: 30px; background: var(--weiss); box-shadow: var(--schatten);
  min-height: clamp(140px, 30vmin, 300px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.stufe .sterne { font-size: clamp(30px, 6vmin, 56px); letter-spacing: 2px; color: var(--gold); text-shadow: 0 2px 0 #C9A44A; }
.stufe .sterne .aus { color: #EBDDE0; text-shadow: none; }
.stufe.zuletzt { outline: 6px solid var(--gold); outline-offset: 0; background: #FFF8E6; }
.stufe:active { transform: translateY(3px) scale(.98); }
.training-knopf {
  border: none; border-radius: 30px; background: linear-gradient(160deg, #F8F2FF, var(--flieder)); box-shadow: var(--schatten);
  min-height: 110px; padding: 10px 26px; display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 800; position: relative;
}
.training-knopf .mini-einhorn { width: 110px; height: 96px; }
.zaehler {
  position: absolute; top: -10px; right: -10px; min-width: 44px; height: 44px; border-radius: 22px; padding: 0 10px;
  background: var(--akzent); color: #fff; font-size: 22px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 3px 0 #A86E77;
}
.stufe-spielname { font-size: clamp(26px, 5vmin, 44px); font-weight: 800; display: flex; align-items: center; gap: 12px; }
.stufe-spielname .flagge { width: 70px; border-radius: 6px; overflow: hidden; }

/* ===================== Spielrunde ===================== */
.fortschritt { display: flex; gap: clamp(2px, 1vmin, 8px); align-items: center; justify-content: center; flex-wrap: nowrap; }
.fortschritt .st { font-size: clamp(14px, min(4.2vmin, calc((100vw - 250px) / 11)), 40px); color: #E9D8DC; transition: transform .3s, color .3s; line-height: 1; }
.fortschritt .st.an { color: var(--gold); transform: scale(1.18); text-shadow: 0 2px 0 #C9A44A; }
.koerbchen { position: relative; width: 76px; height: 76px; display: grid; place-items: center; font-size: 46px; flex: 0 0 auto; }
.koerbchen .zahl { position: absolute; bottom: 0; right: 0; background: var(--flieder); border-radius: 999px; min-width: 30px; height: 30px; font-size: 18px; font-weight: 800; display: grid; place-items: center; }
.koerbchen.wackeln { animation: wackeln .5s ease; }
@keyframes wackeln { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

#s-runde .spielfeld { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 12px; position: relative; }
.karte {
  position: relative; background: var(--weiss); border-radius: 40px; box-shadow: var(--schatten);
  width: min(100%, 860px); height: 100%; max-height: 640px; padding: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.karte.rein { animation: karteRein .35s ease-out; }
@keyframes karteRein { from { transform: translateY(24px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.karte.zum-korb { transition: transform .75s cubic-bezier(.5,-0.2,.6,1), opacity .75s ease; opacity: .0; }
.karte .zeile { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 4vmin, 40px); flex-wrap: wrap; }
.lern {
  font-family: var(--lernschrift); font-weight: 400; line-height: 1.32; color: var(--text);
  font-size: clamp(110px, 25vmin, 190px); letter-spacing: .02em; white-space: nowrap;
  -webkit-text-stroke: .018em var(--text);
}
.lern.lang { font-size: clamp(80px, 17vmin, 150px); }
.lern .s1 { color: var(--silbe1); -webkit-text-stroke-color: var(--silbe1); }
.lern .s2 { color: var(--silbe2); -webkit-text-stroke-color: var(--silbe2); }
.lern .lueck { display: inline-block; width: .16em; }
.bild { font-size: clamp(84px, 18vmin, 160px); line-height: 1; display: grid; place-items: center; }
.bild img { width: clamp(110px, 24vmin, 220px); height: clamp(110px, 24vmin, 220px); object-fit: cover; border-radius: 24px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.bildwort { font-size: clamp(30px, 5.5vmin, 48px); font-weight: 700; font-family: var(--lernschrift); -webkit-text-stroke: .015em var(--text); }
.bildwort .mark { color: var(--markierung); -webkit-text-stroke-color: var(--markierung); }
.en-text { font-size: clamp(30px, 5.6vmin, 48px); font-weight: 700; text-align: center; color: #6A5767; }
.en-de { font-size: clamp(16px, 2.6vmin, 22px); opacity: .6; text-align: center; }
/* English: das Bild steht groß im Mittelpunkt, die Schrift dezent darunter */
.karte.en-karte .bild { font-size: clamp(120px, min(40vw, 29vh), 270px); }
.karte.en-karte .bild img { width: clamp(150px, 36vmin, 320px); height: clamp(150px, 36vmin, 320px); border-radius: 30px; }
/* Antippen von Bild, Buchstabe oder Wort: kurzes Hüpfen als Rückmeldung */
.karte .bild, .karte .lern, .karte .bildwort, .karte .en-text { cursor: pointer; }
.angetippt { animation: antippen .45s cubic-bezier(.2,1.5,.4,1); }
@keyframes antippen { 0% { transform: scale(1); } 35% { transform: scale(1.12); } 100% { transform: scale(1); } }

.bewertung { display: flex; justify-content: center; gap: clamp(20px, 8vw, 90px); padding-top: 12px; flex: 0 0 auto; }
.bewertung .knopf { width: clamp(96px, 16vmin, 140px); height: clamp(96px, 16vmin, 140px); border-radius: 50%; font-size: clamp(50px, 9vmin, 76px); color: #fff; }
.k-ja { background: var(--gruen); box-shadow: 0 6px 0 var(--gruen-d), 0 10px 20px rgba(0,0,0,.12); }
.k-nein { background: var(--rot); box-shadow: 0 6px 0 var(--rot-d), 0 10px 20px rgba(0,0,0,.12); }
.runde-einhorn { width: clamp(120px, 22vmin, 220px); aspect-ratio: 240/212; flex: 0 0 auto; align-self: flex-end; }
@media (orientation: portrait) { .runde-einhorn { position: absolute; right: 0; bottom: 0; width: clamp(100px, 18vmin, 180px); } }

/* ===================== Belohnungsszene ===================== */
#s-szene { padding: 0; overflow: hidden; background: linear-gradient(180deg, #CFE6F7 0%, #EAF4FC 50%, #F6E7EE 100%); }
.szene { position: absolute; inset: 0; }
.szene .boden { position: absolute; left: -10%; right: -10%; bottom: -14vh; height: 42vh; border-radius: 50% 50% 0 0; background: linear-gradient(180deg, #BFE8C8, #9ED8AE); }
.szene .figur { position: absolute; left: 50%; bottom: 14vh; width: min(52vw, 46vh, 420px); aspect-ratio: 240/212; transform: translateX(-62%); }
.szene .medaille { position: absolute; top: calc(var(--oben) + 2vh); left: 50%; width: min(28vw, 26vh, 220px); transform: translateX(-50%); animation: medailleRein .9s cubic-bezier(.2,1.4,.4,1); }
@keyframes medailleRein { from { transform: translateX(-50%) translateY(-60vh) rotate(-30deg); } to { transform: translateX(-50%) translateY(0) rotate(0); } }
.szene .futter { position: absolute; bottom: 13vh; left: 50%; transform: translateX(12%); display: flex; flex-wrap: wrap; width: min(40vw, 34vh, 300px); justify-content: center; font-size: min(9vw, 7vh, 64px); line-height: .9; }
.szene .futter span { animation: futterRein .5s ease-out backwards; }
.szene .futter.einzeln { width: auto; transform: translateX(min(10vw, 9vh, 80px)); }
@keyframes futterRein { from { transform: translateY(-40vh); } to { transform: none; } }
.szene .platz { position: absolute; top: calc(var(--oben) + 2vh); right: var(--rechts); font-size: 28px; font-weight: 800; background: var(--weiss); border-radius: 20px; padding: 8px 16px; box-shadow: var(--schatten); }
.szene .punkte-anzeige { position: absolute; top: calc(var(--oben) + 2vh); left: var(--links); font-size: 30px; font-weight: 800; background: var(--weiss); border-radius: 20px; padding: 8px 16px; box-shadow: var(--schatten); }
.konfetti { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fallen linear forwards; }
@keyframes fallen { to { transform: translateY(110vh) rotate(720deg); } }
.tropfen { position: absolute; width: 10px; height: 16px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #7EC3EE; animation: tropfen linear forwards; opacity: .9; }
@keyframes tropfen { to { transform: translateY(70vh); opacity: 0; } }
.regenbogen { position: absolute; left: 50%; bottom: 30vh; width: min(80vw, 70vh); transform: translateX(-56%); animation: einblenden 1s ease; }
.wiese-blumen { position: absolute; bottom: 6vh; left: 0; right: 0; height: 22vh; }
.wiese-blumen span { position: absolute; font-size: min(7vw, 6vh, 48px); }
.szene .weiter-hinweis { position: absolute; bottom: calc(var(--unten) + 4px); left: 0; right: 0; text-align: center; font-size: 34px; opacity: .55; animation: funkeln 1.6s infinite; }

/* ===================== Berg ===================== */
#s-berg .inhalt { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#s-berg .berg-gross { flex: 1 1 0; min-height: 0; min-width: 0; width: 100%; align-self: stretch; display: flex; justify-content: center; }
#s-berg .berg-gross svg { height: 100%; width: auto; max-width: 100%; aspect-ratio: 300 / 560; }
#s-berg .berg-knoepfe { display: flex; gap: 18px; justify-content: center; flex: 0 0 auto; }
#s-berg .berg-knoepfe .knopf { min-width: 150px; min-height: 96px; font-size: 26px; }
.punkte-info { font-size: 24px; font-weight: 800; background: var(--weiss); border-radius: 20px; padding: 8px 18px; box-shadow: var(--schatten); }
@media (orientation: landscape) {
  #s-berg .inhalt { flex-direction: row; justify-content: center; }
  #s-berg .berg-knoepfe { flex-direction: column; }
}
.berg-svg .station circle { transition: transform .3s; }
.berg-svg .station.erreicht circle.ring { fill: #FFF6D8; stroke: var(--gold); }
.berg-svg .station .schloss { display: none; }
.berg-svg.antippbar .station, .berg-svg.antippbar .reiter { cursor: pointer; }
.berg-svg.antippbar .station.gesperrt .schloss { display: inline; }
.berg-svg.antippbar .station.gesperrt circle.ring { stroke-dasharray: 4 4; }
.berg-svg .station.wackeln > circle.ring, .berg-svg .station.wackeln > text:not(.label) { animation: wackeln .45s ease; transform-box: fill-box; transform-origin: center; }
@keyframes wackeln { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
.hinweisliste { margin: 4px 0 8px; padding-left: 22px; }
.aufn-reihe { gap: 10px; }
.aufn-wahl { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; font-size: 17px; }
.aufn-wahl input { width: 22px; height: 22px; flex: 0 0 auto; accent-color: #9C86D4; }
.hinweisliste li { margin: 4px 0; }
.berg-svg .station.puls circle.ring { animation: puls .7s ease 3; transform-box: fill-box; transform-origin: center; }
@keyframes puls { 50% { transform: scale(1.35); } }

/* ===================== Feier-Overlay ===================== */
.overlay { position: absolute; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: var(--oben) var(--rechts) var(--unten) var(--links); }
.overlay.aktiv { display: flex; animation: einblenden .25s ease; }
#o-feier { background: rgba(255, 246, 250, .72); flex-direction: column; gap: 10px; overflow: hidden; }
#o-feier .gross { font-size: min(30vw, 30vh, 240px); line-height: 1; animation: feierPop .8s cubic-bezier(.2,1.6,.4,1); }
#o-feier .text { font-size: clamp(28px, 6vmin, 52px); font-weight: 800; text-align: center; }
#o-feier .feier-einhorn { width: min(60vw, 40vh, 380px); aspect-ratio: 240/212; }
@keyframes feierPop { from { transform: scale(.2) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
.funke { position: absolute; font-size: 34px; animation: funkeFlug 1.6s ease-out forwards; }
@keyframes funkeFlug { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }

#o-frage { background: rgba(74, 58, 72, .35); }
.frage-box { background: var(--weiss); border-radius: 36px; padding: 28px; box-shadow: var(--schatten); display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 640px; text-align: center; }
.frage-box .frage-text { font-size: clamp(22px, 4vmin, 30px); font-weight: 800; }
.frage-box .frage-icon { font-size: 70px; }
.frage-knoepfe { display: flex; gap: 40px; }
.frage-knoepfe .knopf { width: 120px; height: 120px; border-radius: 50%; font-size: 64px; color: #fff; }

#o-hinweis { pointer-events: none; align-items: flex-start; z-index: 60; }
#o-hinweis .hinweis-text { margin-top: 12px; background: var(--text); color: #fff; border-radius: 18px; padding: 12px 20px; font-size: 20px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: 90%; text-align: center; }

/* ===================== Trophäen-Regal ===================== */
#s-regal .inhalt { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.regal { width: min(980px, 100%); display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; background: #E9C9A8; border-radius: 26px; padding: 18px 14px 0; box-shadow: var(--schatten); position: relative; }
.regal::after { content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 24px; background: #CFA57F; border-radius: 0 0 20px 20px; }
@media (orientation: portrait) { .regal { grid-template-columns: repeat(3, 1fr); row-gap: 24px; } }
.fach { border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 4px 18px; border-bottom: 10px solid #CFA57F; }
.fach svg { width: clamp(70px, 14vmin, 130px); height: clamp(70px, 14vmin, 130px); }
.fach .anzahl { font-size: clamp(30px, 6vmin, 52px); font-weight: 800; color: var(--text); background: rgba(255,255,255,.75); border-radius: 18px; min-width: 70px; padding: 0 10px; }
.fach .was { font-size: 15px; font-weight: 700; opacity: .7; }
.fach.hops svg { animation: fachHops .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes fachHops { 0% { transform: scale(1); } 40% { transform: scale(1.18) rotate(-6deg); } 100% { transform: scale(1); } }

/* ===================== Einstellungen ===================== */
#s-einst { padding-bottom: 0; }
#s-einst h2 { margin: 0; font-size: 28px; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.einst-inhalt { flex: 1; min-height: 0; padding-bottom: calc(var(--unten) + 30px); }
.einst-inhalt, .einst-inhalt * { -webkit-user-select: none; user-select: none; }
.abschnitt { background: rgba(255,255,255,.82); border-radius: 24px; padding: 16px 18px; margin: 0 auto 16px; max-width: 920px; box-shadow: 0 3px 0 rgba(201,138,147,.35); }
.abschnitt h3 { margin: 0 0 10px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
.abschnitt p, .abschnitt .info { margin: 6px 0; font-size: 16px; line-height: 1.4; }
.info { opacity: .78; }
.reihe { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid rgba(201,138,147,.25); }
.reihe:first-of-type { border-top: none; }
.reihe label.titel-l { flex: 1 1 200px; font-size: 18px; font-weight: 700; }
.feld { flex: 1 1 220px; min-height: 52px; border-radius: 14px; border: 2px solid var(--flaeche); background: #fff; padding: 8px 12px; color: var(--text); }
select.feld { -webkit-appearance: none; appearance: none; }
.e-knopf { border: none; border-radius: 16px; background: var(--flieder); min-height: 52px; min-width: 52px; padding: 6px 16px; font-size: 17px; font-weight: 700; box-shadow: 0 3px 0 rgba(150,120,190,.45); }
.e-knopf:active { transform: translateY(2px); }
.e-knopf.warn { background: #F6C8C8; box-shadow: 0 3px 0 rgba(200,120,120,.45); }
.e-knopf.gruen { background: var(--mint); box-shadow: 0 3px 0 rgba(90,170,140,.45); }
.e-knopf[disabled] { opacity: .45; }
.schalter { position: relative; display: inline-block; vertical-align: middle; width: 66px; height: 40px; flex: 0 0 auto; }
.schalter input { position: absolute; inset: 0; opacity: 0; margin: 0; z-index: 2; width: 100%; height: 100%; }
.schalter span { position: absolute; inset: 0; background: #DCC9CD; border-radius: 999px; transition: background .2s; }
.schalter span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 32px; height: 32px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .2s; }
.schalter input:checked + span { background: var(--gruen); }
.schalter input:checked + span::after { transform: translateX(26px); }
.schalter input:disabled + span { opacity: .45; }
.filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.filter .fk { border: none; border-radius: 999px; padding: 0 16px; min-height: 48px; font-size: 16px; font-weight: 700; background: #F4E7EA; }
.filter .fk.an { background: var(--akzent); color: #fff; }
.kartenliste .kz { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(201,138,147,.25); flex-wrap: wrap; }
.kz .kz-bild { width: 54px; height: 54px; font-size: 38px; display: grid; place-items: center; flex: 0 0 auto; }
.kz .kz-bild img { width: 54px; height: 54px; border-radius: 12px; object-fit: cover; }
.kz .kz-text { flex: 1 1 160px; min-width: 0; }
.kz .kz-titel { font-size: 20px; font-weight: 800; }
.kz .kz-unter { font-size: 14px; opacity: .75; overflow-wrap: anywhere; }
.kz .badge { display: inline-block; background: var(--flieder); border-radius: 8px; padding: 1px 8px; font-size: 13px; font-weight: 800; margin-left: 6px; vertical-align: middle; }
.kz .kz-akt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kz.aus { opacity: .5; }
.mini-label { font-size: 12px; font-weight: 700; opacity: .7; display: block; text-align: center; }
.formular { display: grid; gap: 10px; }
.formular label { font-weight: 700; font-size: 16px; display: grid; gap: 4px; }
.wort-wahl { display: flex; flex-wrap: wrap; gap: 8px; }
.datenschutz { text-align: center; font-size: 15px; opacity: .75; margin: 10px auto 30px; max-width: 760px; }
.version { text-align: center; font-size: 13px; opacity: .55; }

/* ===================== Testmodus ===================== */
#test-knopf { position: absolute; left: calc(env(safe-area-inset-left) + 6px); bottom: calc(env(safe-area-inset-bottom) + 6px); z-index: 80; width: 52px; height: 52px; border-radius: 50%; border: none; background: #fff; font-size: 26px; box-shadow: var(--schatten); }
#test-panel { position: absolute; left: calc(env(safe-area-inset-left) + 6px); bottom: calc(env(safe-area-inset-bottom) + 66px); z-index: 80; background: #fff; border-radius: 18px; padding: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.25); max-width: 340px; display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; }
#test-panel b { width: 100%; }

/* ===================== Weniger Bewegung ===================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Schmale Hochformat-Geräte (iPhone): Einhorn größer, Berg-Vorschau kleiner */
@media (orientation: portrait) and (max-width: 600px) {
  .buehne { align-items: flex-end; }
  .buehne .start-einhorn { width: 66%; max-width: none; }
  .berg-vorschau { height: 58%; flex: 0 0 auto; }
}

/* ===================== Karten-Extras (Schritt 2 und 3) ===================== */
.hilfe-knopf { position: absolute; top: 14px; right: 14px; z-index: 2; background: var(--himmel); }

.mikro {
  width: clamp(96px, 16vmin, 140px); height: clamp(96px, 16vmin, 140px); border-radius: 50%;
  font-size: clamp(46px, 8vmin, 70px); background: var(--flieder); box-shadow: 0 6px 0 #A890D0, 0 10px 20px rgba(0,0,0,.12);
}
.mikro.hoert { background: #F7B8CA; animation: pulsieren 1.3s ease-out infinite; }
@keyframes pulsieren {
  0% { box-shadow: 0 6px 0 #D98BA2, 0 0 0 0 rgba(232, 111, 142, .55); }
  70% { box-shadow: 0 6px 0 #D98BA2, 0 0 0 28px rgba(232, 111, 142, 0); }
  100% { box-shadow: 0 6px 0 #D98BA2, 0 0 0 0 rgba(232, 111, 142, 0); }
}
.bewertung { align-items: center; }
.bewertung.mit-sr .k-ja, .bewertung.mit-sr .k-nein { width: 76px; height: 76px; font-size: 40px; opacity: .85; }

.en-text .wort { border-radius: 12px; padding: 0 .08em; transition: background .15s; }
.en-text .wort.jetzt { background: #FFEFA6; }
.en-text.satz { font-size: clamp(26px, 4.6vmin, 42px); line-height: 1.25; max-width: 92%; }
.en-knoepfe { display: flex; gap: 16px; justify-content: center; margin-top: 6px; }
.en-knoepfe .knopf { width: 72px; height: 72px; min-width: 72px; font-size: 34px; }
.flagge-knopf svg { width: 40px; height: 24px; border-radius: 4px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
@media (orientation: landscape) and (max-height: 520px) {
  .en-knoepfe .knopf, .hilfe-knopf { width: 64px; height: 64px; min-width: 64px; font-size: 28px; }
  .karte .bild { font-size: clamp(56px, 14vmin, 120px); }
}

.en-mitte { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; width: 100%; }
@media (orientation: landscape) and (max-height: 520px) {
  .karte.en-karte { flex-direction: row; gap: 18px; padding: 12px 18px; }
  .karte.en-karte .en-mitte { flex: 1 1 auto; width: auto; }
  .karte.en-karte .en-knoepfe { margin-top: 0; gap: 10px; }
  .karte.en-karte .en-text { font-size: clamp(22px, 6.5vmin, 36px); }
  .karte.en-karte .en-text.satz { font-size: clamp(19px, 5.4vmin, 30px); }
  .karte.en-karte .bild { font-size: clamp(64px, 26vh, 124px); flex: 0 0 auto; }
  .karte.en-karte .bild img { width: clamp(84px, 30vh, 140px); height: clamp(84px, 30vh, 140px); }
}

/* Laut im Wortinneren: Bildwort groß und gegliedert (Dra-ch-e) */
.lern.wortlaut { font-size: clamp(56px, 11.5vmin, 124px); }
.lern.wortlaut .ziel { color: var(--markierung); -webkit-text-stroke-color: var(--markierung); font-size: 1.12em; }
.lern.wortlaut .trenn { color: #C9B3BA; -webkit-text-stroke-color: #C9B3BA; margin: 0 .04em; }

/* ===================== Zwischensequenz an den Berg-Stationen ===================== */
#o-feier.station-pop { background: rgba(74, 58, 72, .38); }
.pop-karte {
  position: relative; z-index: 2; background: var(--weiss); border-radius: 34px; box-shadow: 0 18px 50px rgba(74,58,72,.3);
  width: min(92vw, 760px, calc((100vh - 170px) * 1.75)); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  animation: feierPop .55s cubic-bezier(.2,1.5,.4,1);
}
.pop-szene { position: relative; width: 100%; aspect-ratio: 400 / 220; border-radius: 24px; overflow: hidden; }
.pop-szene > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pop-einhorn { position: absolute; left: 50%; bottom: 4%; width: 36%; aspect-ratio: 240 / 212; transform: translateX(-50%); }
.pop-titel { display: flex; align-items: center; gap: 12px; font-size: clamp(24px, 5vmin, 40px); font-weight: 800; }
.pop-symbol { font-size: 1.3em; }
.pop-weiter { width: 84px; height: 84px; font-size: 38px; color: #fff; }
@media (orientation: landscape) and (max-height: 520px) {
  .pop-karte { flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 10px; gap: 8px 14px; width: min(94vw, calc((100vh - 120px) * 1.82 + 24px)); }
  .pop-titel { font-size: 24px; }
  .pop-weiter { width: 68px; height: 68px; font-size: 30px; }
}

/* ===================== Einstellungen: Übersicht und Untermenüs ===================== */
.einst-kacheln { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 920px; margin: 4px auto 16px; }
@media (max-width: 600px) { .einst-kacheln { grid-template-columns: minmax(0, 1fr); } }
.einst-kachel {
  border: none; border-radius: 26px; background: rgba(255,255,255,.9); box-shadow: 0 4px 0 rgba(201,138,147,.35), 0 8px 18px rgba(74,58,72,.08);
  min-height: 120px; padding: 16px 18px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 14px; align-items: center; text-align: left;
}
.einst-kachel:active { transform: translateY(2px); }
.ek-icon { grid-row: 1 / span 2; font-size: 46px; width: 70px; height: 70px; display: grid; place-items: center; background: var(--bg); border-radius: 20px; }
.ek-titel { font-size: 22px; font-weight: 800; }
.ek-text { font-size: 15px; opacity: .72; line-height: 1.3; }
.status { border-radius: 14px; padding: 10px 14px; font-size: 16px; line-height: 1.4; margin: 4px 0 8px; }
.status.ok { background: #DDF3E6; }
.status.warn { background: #FFF1D6; }
.regler { flex: 1 1 220px; -webkit-appearance: none; appearance: none; height: 10px; border-radius: 6px; background: var(--flieder); outline: none; }
.regler::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 3px solid var(--akzent); box-shadow: 0 2px 4px rgba(0,0,0,.2); }

/* Einhorn je Menü */
.stufe-einhorn { width: min(36vw, 24vh, 250px); aspect-ratio: 240 / 212; flex: 0 0 auto; }
#s-regal .inhalt { flex-direction: column; gap: 10px; }
.regal-einhorn { width: min(40vw, 24vh, 250px); aspect-ratio: 240 / 212; flex: 0 0 auto; }
@media (orientation: landscape) and (max-height: 520px) { .stufe-einhorn, .regal-einhorn { width: 21vh; } }

/* Kleine Querformat-Bildschirme (iPhone quer): weniger Höhe */
@media (orientation: landscape) and (max-height: 520px) {
  .stufe-einhorn, .regal-einhorn { display: none; }
  #s-stufe .inhalt { gap: 12px; }
  .stufe { min-height: 110px; }
  .training-knopf { min-height: 84px; }
  .training-knopf .mini-einhorn { width: 84px; height: 74px; }
  .lern { font-size: clamp(64px, 21vh, 110px); line-height: 1.15; }
  .lern.wortlaut { font-size: clamp(44px, 13vh, 80px); }
  .bildwort { font-size: 24px; }
  .karte { padding: 10px 16px; gap: 2px; }
}
@media (max-width: 600px) { #s-einst h2 { font-size: 21px; } }
</style>
</head>

<script>
// Fehlen die Inhaltsdateien ganz, zeigt der Lader oben eine Reparatur-Seite – dann hier nicht weiterlaufen.
if (window.INHALT_FATAL) throw new Error("Einhorn-ABC: Inhaltsdateien fehlerhaft");
/* ---------- Grafiken (eigene SVGs) ---------- */
const FARBE = {
  linie: "#5B4458", weiss: "#FFFFFF", schatten: "#F2E8F4",
  rosa: "#F6A5C0", gelb: "#FBE29B", flieder: "#CDB4F0", mint: "#A6E3CF", himmel: "#A9D4F5",
  gold: "#F3D27A", goldDunkel: "#D9AE4B", huf: "#C9B3EE", wange: "#F7A8BC", auge: "#3E2E3C",
  herz: "#F48FB1", rose: "#E86F8E", roseDunkel: "#C94F70", blatt: "#7CC79F"
};
const LINIE = `stroke="${FARBE.linie}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;

function hornVerlaufDef() {
  return `<linearGradient id="hornVerlauf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F0C761"/><stop offset=".55" stop-color="#F8DF94"/><stop offset="1" stop-color="#FFF4CC"/></linearGradient>`;
}

/* Kopf-Form (Kopf + Schnauze) – erst Umriss, dann Füllung, damit innen keine Linie bleibt */
const KOPF_FORMEN = `<circle cx="168" cy="64" r="40"/><ellipse cx="203" cy="81" rx="25" ry="20"/>`;
const HALS_PFAD = "M132,118 C134,100 142,88 154,80 L182,94 C172,104 166,116 164,130 Z";

// Mähne hinten am Hals (liegt hinter dem Kopf)
function maehneHinten() {
  const F = FARBE;
  return `<g class="u-maehne">
    <path d="M156,30 C128,34 116,60 122,84 C126,100 120,112 110,120 C134,120 146,102 144,84 C142,64 150,46 166,36 Z" fill="${F.rosa}" ${LINIE}/>
    <path d="M150,48 C134,62 132,84 140,102 C144,112 140,122 132,128 C154,126 160,108 156,92 C152,76 156,62 164,52 Z" fill="${F.flieder}" ${LINIE}/>

    <path d="M154,70 C146,86 148,102 156,114 C150,124 146,130 140,134 C160,134 168,118 166,104 C164,92 162,82 162,74 Z" fill="${F.mint}" ${LINIE}/>
    <path d="M148,40 C134,48 128,62 130,76 M150,60 C142,72 142,86 146,98" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".75"/>
  </g>`;
}
// Stirnlocke vorne (liegt über dem Kopf)
function maehneVorne() {
  const F = FARBE;
  return `<g class="u-locke">
    <path d="M172,28 C156,26 144,36 144,50 C144,58 140,64 134,66 C150,70 158,60 158,50 C158,42 164,36 174,36 Z" fill="${F.himmel}" ${LINIE}/>
    <path d="M178,30 C168,34 162,44 164,56 C165,62 162,68 158,70 C172,72 176,62 174,54 C173,46 176,40 184,36 Z" fill="${F.rosa}" ${LINIE}/>
  </g>`;
}
function kopfDetails() {
  const F = FARBE;
  return `
    <path d="M148,38 C144,22 150,8 160,2 C170,10 172,24 168,38 Z" fill="${F.weiss}" ${LINIE}/>
    <path d="M153,34 C151,24 155,15 160,11 C165,17 166,26 164,34 Z" fill="${F.wange}"/>

    <g fill="${F.weiss}">${KOPF_FORMEN}</g>
    <path d="M150,96 C156,100 164,101 172,99" stroke="${F.schatten}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M220,74 q3,3 0,6" stroke="${F.linie}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M204,93 Q211,98 219,92" stroke="${F.linie}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <ellipse cx="196" cy="86" rx="8.5" ry="5.2" fill="${F.wange}" opacity=".85"/>
    <g class="u-auge">

    <g class="u-brille"><circle cx="185" cy="62" r="15.5" fill="#fff" fill-opacity=".06" ${LINIE} stroke-width="3.2"/><path d="M200,60 C206,58 210,60 214,64 M170,60 L160,56" ${LINIE} fill="none" stroke-width="3"/></g>

    </g>`;
}

// Zubehör je Menü: "mit-rucksack", "mit-buch", "mit-england", "mit-training", "mit-medaille", "mit-krone"
function zubehoerHinten(z) {
  const F = FARBE; let s = "";
  return s;
}
function zubehoerRuecken(z) {
  const F = FARBE;
  if (!z.includes("mit-rucksack")) return "";
  return `<g class="u-rucksack">
      <rect x="84" y="80" width="42" height="40" rx="13" fill="#8DB6E0" ${LINIE}/>
      <path d="M86,95 C96,103 114,103 124,95" fill="none" ${LINIE}/>

      <rect x="80" y="68" width="50" height="16" rx="8" fill="${F.rosa}" ${LINIE}/>
      <path d="M92,70 v12 M118,70 v12" ${LINIE} stroke-width="2"/>

}
function zubehoerVorne(z) {
  const F = FARBE; let s = "";
  if (z.includes("mit-rucksack")) s += `
    <path d="M128,98 C138,112 150,118 160,118" stroke="#6E9CCB" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M144,104 C152,116 164,122 176,118 L170,130 Z" fill="#7CC79F" ${LINIE} stroke-width="2.6"/>`;

/* ---------- kleine Hilfen ---------- */

const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function ersetze(t) { return String(t).replace(/\{einhorn\}/g, S.einhornName || "Dein Einhorn").replace(/\{name\}/g, S.kindName || ""); }

/* =====================================================================
   Speicher (localStorage) und Fotos (IndexedDB)
   ===================================================================== */
function standardZustand() {
  return {
    einhornName: "", kindName: "",

    toene: true, musik: false, spracherkennung: false,
    lobVorlesen: false,              // Lob per Stimme (Standard: aus)

    berg: { punkte: 0, touren: 0 },

    stufe: { abc: "E", en: "E" },
    letzteRunde: { abc: [], en: [] },
    fehler: { abc: [], en: [] },     // [{ id, seit, richtig }]
    ausgeblendet: {},                // id -> true
    aufnahmeDe: "auto", aufnahmeEn: "auto",   // aufgenommene Stimme: "auto" = erste, "ipad" = keine, sonst id
    stimmeDeTempo: 1, stimmeDeHoehe: CONFIG.stimmhoehe,   // Faktor auf das Grundtempo, Stimmhöhe
    stimmeEnTempo: 1, stimmeEnHoehe: CONFIG.stimmhoehe,
    fotos: {},                       // "id|wortIndex" -> true
    eigeneKarten: [],
    lobIndex: 0,
    datenStand: DATEN_STAND          // für einmalige Umstellungen bei neuen Versionen
  };
}
// Einmalige Umstellungen für Spielstände aus älteren Versionen (auch beim Laden einer Sicherung)
function zustandAktualisieren(roh) {
  const stand = roh && typeof roh.datenStand === "number" ? roh.datenStand : 1;
  if (stand < 2) {
    // Version 4.2: natürlichere Stimmhöhe und keine Knopf-Ansagen mehr als Standard
    if (Math.abs(S.stimmeDeHoehe - 1.05) < 0.001) S.stimmeDeHoehe = CONFIG.stimmhoehe;
    S.knoepfeAnsagen = false;
  }
  S.datenStand = DATEN_STAND;
}
function mischeZustand(basis, neu) {
  if (!neu || typeof neu !== "object") return basis;
  for (const k of Object.keys(basis)) {
    if (!(k in neu)) continue;
    const b = basis[k], n = neu[k];
    if (b && typeof b === "object" && !Array.isArray(b) && n && typeof n === "object" && !Array.isArray(n)) basis[k] = Object.assign({}, b, n);
    else if (Array.isArray(b)) basis[k] = Array.isArray(n) ? n : b;
    else if (typeof n === typeof b) basis[k] = n;
  }
  return basis;
}
let S = standardZustand();
function laden() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (roh) {
      const daten = JSON.parse(roh);
      S = mischeZustand(standardZustand(), daten);
      if (!daten || daten.datenStand !== DATEN_STAND) { zustandAktualisieren(daten); speichere(); }
    }
  }
  catch (e) { S = standardZustand(); }
}
let speichernGesperrt = false;   // beim Zurücksetzen: nichts mehr zurückschreiben
function speichere() { if (speichernGesperrt) return; try { localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(S)); } catch (e) { /* Speicher voll oder gesperrt */ } }

const DB = {
  db: null, kaputt: false,
  oeffnen() {
    if (this.db || this.kaputt) return Promise.resolve(this.db);
    return new Promise((res) => {
      try {
        const r = indexedDB.open("einhornABC", 1);
        r.onupgradeneeded = () => { r.result.createObjectStore("fotos"); };
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => { this.kaputt = true; res(null); };
        r.onblocked = () => { this.kaputt = true; res(null); };
      } catch (e) { this.kaputt = true; res(null); }
    });
  },
  async aktion(modus, fn) {
    const db = await this.oeffnen(); if (!db) return null;
    return new Promise((res) => {
      try {
        const tx = db.transaction("fotos", modus); const st = tx.objectStore("fotos");
        const r = fn(st); tx.oncomplete = () => res(r && "result" in r ? r.result : true); tx.onerror = () => res(null); tx.onabort = () => res(null);
      } catch (e) { res(null); }
    });
  },
  get(k) { return this.aktion("readonly", (st) => st.get(k)); },
  put(k, v) { return this.aktion("readwrite", (st) => st.put(v, k)); },
  del(k) { return this.aktion("readwrite", (st) => st.delete(k)); },
  leeren() { return this.aktion("readwrite", (st) => st.clear()); },
  async alle() {
    const db = await this.oeffnen(); if (!db) return [];
    return new Promise((res) => {
      const aus = [];
      try {
        const tx = db.transaction("fotos", "readonly"); const r = tx.objectStore("fotos").openCursor();
        r.onsuccess = () => { const c = r.result; if (c) { aus.push({ k: c.key, v: c.value }); c.continue(); } };
        tx.oncomplete = () => res(aus); tx.onerror = () => res(aus);
      } catch (e) { res(aus); }
    });
  }
};
const fotoCache = {};
async function fotoURL(schluessel) {
  if (!S.fotos[schluessel]) return null;
  if (fotoCache[schluessel]) return fotoCache[schluessel];
  const blob = await DB.get(schluessel);
  if (!blob) return null;
  fotoCache[schluessel] = URL.createObjectURL(blob);
  return fotoCache[schluessel];
}
function fotoCacheLeeren(schluessel) {
  for (const k of Object.keys(fotoCache)) if (!schluessel || k === schluessel) { URL.revokeObjectURL(fotoCache[k]); delete fotoCache[k]; }
}
async function bildVerkleinern(datei, max = 600) {
  const url = URL.createObjectURL(datei);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const f = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}
function fotoWaehlen() {
  return new Promise((res) => {
    const inp = $("#datei-foto"); inp.value = "";
    inp.onchange = () => res(inp.files && inp.files[0] ? inp.files[0] : null);
    inp.click();

}

const NEUHEITS_STIMMEN = /eloquence|grandma|grandpa|rocko|shelley|flo\b|reed|sandy|eddy|bad news|bells|bubbles|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|bahh|boing|cellos|good news|junior|ralph|fred|kathy|hysterical/i;

   Aufgenommene Stimmen (stimmen.json + stimme-….bin)

   den Inhaltsdateien, andere Namen), spricht weiter die iPad-Stimme.
   ===================================================================== */
const Aufnahmen = {
  liste: [], pakete: {}, puffer: new Map(), quelle: null, nr: 0, timer: [], fertig: null,
  schluessel(t) { return String(t).trim().replace(/\s+/g, " "); },

      .then((r) => (r.ok ? r.json() : null))

  paket(v) {

  }
};

const Sprache = {
  stimmen: [], aktiv: null,
  laden() {
    if (!("speechSynthesis" in window)) return;
    const f = () => { try { this.stimmen = speechSynthesis.getVoices() || []; } catch (e) { } if (aktuellerScreen === "s-einst") stimmenListenFuellen(); };
    f(); try { speechSynthesis.addEventListener("voiceschanged", f); } catch (e) { speechSynthesis.onvoiceschanged = f; }

  wertung(v, sp) {

    if (v.localService) p += 1;
    if (sp === "de") { if (/de[-_]de/i.test(v.lang)) p += 2; if (/anna|petra|helena|marlene|vicki/.test(n)) p += 1; }

async function bewerte(richtig) {

async function belohnenUndBerg(erg, spiel) {

  else S.berg.punkte = neu;

}

}
function blume(x, y, f, g = 1) {

// Pop-up mit kleiner Szene: Einhorn galoppiert herein, freut sich, Konfetti. Weiter per Tipp oder nach einigen Sekunden.
async function stationPopup(i, ziel = false, nochmal = false) {
  const s = CONFIG.stationen[i], o = $("#o-feier");
  o.classList.add("station-pop");
  o.innerHTML = `<div class="pop-karte">
      <div class="pop-szene">${stationSzeneSVG(i)}<div class="pop-einhorn">${einhornSVG("mit-rucksack" + (ziel ? " mit-krone" : krone()))}</div></div>
      <div class="pop-titel"><span class="pop-symbol">${s.symbol}</span><span>${ziel ? "👑 " : ""}${esc(s.name)}</span></div>
      <button class="knopf rund k-ja pop-weiter" aria-label="Weiter">▶</button>
    </div>`;
  o.classList.add("aktiv");
  const figur = o.querySelector(".pop-einhorn"), u = figur.querySelector(".einhorn");
  const weiter = new Promise((res) => { o.querySelector(".pop-weiter").onclick = () => res(); o.onclick = (e) => { if (e.target === o) res(); }; });
  let uebersprungen = false; weiter.then(() => { uebersprungen = true; });
  if (!WENIG_BEWEGUNG) {
    figur.style.transform = "translateX(-260%)"; void figur.offsetWidth;
    figur.style.transition = "transform 1.6s ease-out"; figur.style.transform = "translateX(-50%)";
    einhornAnim(u, "galopp"); Ton.spiele("galopp");
    await Promise.race([warte(1650), weiter]);
  } else figur.style.transform = "translateX(-50%)";
  // Angekommen: eigene kleine Melodie (je Station etwas höher), Konfetti, danach die Ansage
  einhornAnim(u, "huepfen", 900);
  const melodieMs = uebersprungen ? 0 : ziel ? Ton.melodie("krone") : Ton.melodie("station", { halbtoene: STATION_TON[i] || 0 });
  konfettiStreuen(o, ziel ? 70 : 40); funkenSpruehen(o, ziel ? 30 : 18);
  const sprechen = (async () => {
    await warte(melodieMs ? melodieMs + 150 : 0);
    if (uebersprungen) return;
    await Sprache.sprich(ersetze(ziel ? (nochmal ? CONFIG.kroneNochmalSatz || s.satz : CONFIG.kroneSatz || s.satz) : s.satz));
    setTimeout(() => einhornAnim(u, "huepfen", 900), 200);
    if (ziel && !nochmal && CONFIG.neueTourSatz) { await warte(300); if (!uebersprungen) await Sprache.sprich(ersetze(CONFIG.neueTourSatz)); }
  })();
  await Promise.race([weiter, Promise.all([sprechen, warte(ziel ? 6500 : 5000)])]);
  uebersprungen = true; Sprache.stop(); Ton.melodienStopp();
  o.onclick = null; o.classList.remove("aktiv", "station-pop"); o.innerHTML = "";
}
async function stationFeiern(i) { await stationPopup(i, false); }
async function zielFeiern() { await stationPopup(CONFIG.stationen.length - 1, true); }
async function bergNachRunde(alt, plus, krone) {
  zeige("s-berg");
  $("#berg-knoepfe").classList.add("versteckt");
  $("#berg-gross").innerHTML = bergSVG("gross");
  const svg = $("#berg-gross svg");
  const ziel = bergZiel();
  bergReiterSetzen(svg, alt); bergInfo(alt);
  await warte(500);
  const ende = Math.min(alt + plus, ziel);
  // Stationen auf dem Weg einzeln feiern
  let p = alt;
  for (let i = 1; i < CONFIG.stationen.length; i++) {
    const sp = CONFIG.stationen[i].punkte;
    if (sp > alt && sp <= ende) {
      await animiereReiter(svg, p, sp); p = sp; bergInfo(p);
      const st = svg.querySelector(`.station[data-i="${i}"]`); if (st) { st.classList.add("puls"); }
      if (i === CONFIG.stationen.length - 1) await zielFeiern(); else await stationFeiern(i);
    }
  }
  if (p < ende) { await animiereReiter(svg, p, ende); bergInfo(ende); }
  if (krone) {
    // neue Tour beginnt (mit Überschuss)
    $("#berg-gross").innerHTML = bergSVG("gross");
    const neuSvg = $("#berg-gross svg"); bergReiterSetzen(neuSvg, 0); bergInfo(0);
    if (S.berg.punkte > 0) { await warte(400); await animiereReiter(neuSvg, 0, S.berg.punkte); }
    bergInfo(S.berg.punkte);
  }
  $("#berg-knoepfe").classList.remove("versteckt");
  stationenAntippbar($("#berg-gross svg"));
}
function bergEinrichten() {
  $("#berg-nochmal").onclick = () => {
    if (TESTMODUS && R.test) { R.test = false; return stufenwahl(R.spiel); }
    if (R.training && trainingsKarten(R.spiel).length) starteRunde(R.spiel, S.stufe[R.spiel], true);
    else starteRunde(R.spiel, R.training ? S.stufe[R.spiel] : R.stufe, false);
  };
}

    { svg: blumeSVG(), n: T.blumen, was: "Wiesenblumen", sag: (n) => `${n} ${n === 1 ? "Wiesenblume" : "Wiesenblumen"}` },
    { svg: kroneSVG(), n: T.kronen, was: "Kronen", sag: (n) => `${n} ${n === 1 ? "Krone" : "Kronen"}` }
  ];

      b.classList.remove("hops"); void b.offsetWidth; b.classList.add("hops");
      if (S.knoepfeAnsagen) Sprache.sprich(`Du hast ${f.sag(f.n)}!`);
    };
    box.appendChild(b);

function stimmenListenFuellen() {
  const fuelle = (sel, sp, gewaehlt) => {

async function fotoFuerKarte(k) {
  let index = 0;
  if (k.teil === "de" && k.woerter && k.woerter.length > 1) {
    index = await new Promise((res) => {
      const o = $("#o-frage"); const t = $("#frage-text");
      $("#frage-icon").textContent = "📷";
      t.innerHTML = `Zu welchem Bildwort gehört das Foto?<div class="wort-wahl" style="justify-content:center;margin-top:14px">${k.woerter.map((w, i) => `<button class="e-knopf" data-i="${i}">${esc(w[1])} ${esc(w[0])}</button>`).join("")}</div>`;
      o.classList.add("aktiv");
      $("#frage-ja").parentElement.classList.add("versteckt");
      const fertig = (wert) => { o.onclick = null; o.classList.remove("aktiv"); $("#frage-ja").parentElement.classList.remove("versteckt"); res(wert); };
      $$(".wort-wahl button", t).forEach((b) => b.onclick = () => fertig(+b.dataset.i));
      o.onclick = (e) => { if (e.target === o) fertig(-1); };
    });
    if (index < 0) return;
  }
  const datei = await fotoWaehlen(); if (!datei) return;
  try {
    const blob = await bildVerkleinern(datei);
    const key = k.id + "|" + index;
    if ((await DB.put(key, blob)) === null) { hinweis("Foto konnte nicht gespeichert werden."); return; }
    S.fotos[key] = true; fotoCacheLeeren(key); speichere(); kartenlisteZeichnen(); hinweis("Foto gespeichert");
  } catch (e) { hinweis("Das Foto konnte nicht gelesen werden."); }
}

      <option value="wort">Englisches Wort</option><option value="satz">Englischer Satz</option></select></label>
    <label><span id="n-anzeige-l">Anzeige (z. B. „Ei“, „ß“ oder „Ro|se“ mit | als Silbengrenze)</span><input class="feld" id="n-anzeige" value="${esc(anzeige || "")}"></label>
    <label><span id="n-bildwort-l">Bildwort (z. B. „Eimer“)</span><input class="feld" id="n-bildwort" value="${esc(bildwort || "")}"></label>
    <label>Bild: Emoji eingeben …<input class="feld" id="n-emoji" value="${esc(emoji || "")}" placeholder="z. B. 🪣"></label>
    <div class="reihe" style="border:none"><button class="e-knopf" id="n-foto">📷 … oder Foto wählen</button><span id="n-foto-info" class="info"></span></div>
    <label>Stufe<select class="feld" id="n-stufe"><option value="E">Einfach</option><option value="M">Mittel</option><option value="S">Schwer</option></select></label>
    <label>Weitere akzeptierte Antworten (kommagetrennt, optional)<input class="feld" id="n-extra" value="${esc(extra.join(", "))}"></label>
    <div class="reihe" style="border:none"><button class="e-knopf gruen" id="n-speichern">💾 Speichern</button>
      ${karte ? `<button class="e-knopf" id="n-abbrechen">Abbrechen</button><button class="e-knopf warn" id="n-loeschen">🗑️ Karte löschen</button>` : ""}</div>`;
  $("#n-typ").value = typWert; $("#n-stufe").value = k.stufe || "E";
  if (karte) $("#n-typ").disabled = true;
  const typAnpassen = () => {
    const en = ["wort", "satz"].includes($("#n-typ").value);
    $("#n-anzeige-l").textContent = en ? "Englischer Text (z. B. „house“)" : "Anzeige (z. B. „Ei“, „ß“ oder „Ro|se“ mit | als Silbengrenze)";
    $("#n-bildwort-l").textContent = en ? "Deutsche Bedeutung (z. B. „Haus“)" : "Bildwort (z. B. „Eimer“)";
  };
  $("#n-typ").onchange = typAnpassen; typAnpassen();
  $("#n-foto").onclick = async () => { const d = await fotoWaehlen(); if (d) { formularFoto = await bildVerkleinern(d); $("#n-foto-info").textContent = "Foto ausgewählt ✓"; } };
  $("#n-speichern").onclick = () => karteSpeichern(karte);
  if (karte) {
    $("#n-abbrechen").onclick = () => formularZeichnen(null);
    $("#n-loeschen").onclick = async () => {
      if (!(await frage("Diese eigene Karte löschen?", "🗑️", false))) return;
      S.eigeneKarten = S.eigeneKarten.filter((x) => x.id !== karte.id);
      for (const key of Object.keys(S.fotos)) if (key.startsWith(karte.id + "|")) { await DB.del(key); delete S.fotos[key]; fotoCacheLeeren(key); }
      ["abc", "en"].forEach((sp) => { S.fehler[sp] = S.fehler[sp].filter((e) => e.id !== karte.id); });
      delete S.ausgeblendet[karte.id]; speichere(); formularZeichnen(null); kartenlisteZeichnen(); hinweis("Karte gelöscht");
    };
  }
}
async function karteSpeichern(alt) {
  const typ = $("#n-typ").value, anzeige = $("#n-anzeige").value.trim(), bildwort = $("#n-bildwort").value.trim();
  const emoji = $("#n-emoji").value.trim(), stufe = $("#n-stufe").value;
  const extra = $("#n-extra").value.split(",").map((s) => s.trim()).filter(Boolean);
  if (!anzeige || !bildwort) { hinweis("Bitte Anzeige und Bildwort bzw. Bedeutung ausfüllen."); return; }
  if (!emoji && !formularFoto && !(alt && Object.keys(S.fotos).some((x) => x.startsWith(alt.id + "|")))) { hinweis("Bitte ein Emoji eingeben oder ein Foto wählen."); return; }
  const id = alt ? alt.id : "eigen-" + Date.now().toString(36);
  let k;
  if (typ === "wort" || typ === "satz") k = { id, teil: "en", typ, text: anzeige, de: bildwort, bild: emoji || "🖼️", stufe, eigen: true, varianten: extra.length ? extra : undefined };
  else if (typ === "buchstabe") k = { id, teil: "de", typ: "buchstabe", zeichen: anzeige.length === 1 ? grossForm(anzeige) : anzeige, stufe, laut: anzeige.toLowerCase(), name: [], woerter: [[bildwort, emoji || "🖼️"]], extra, eigen: true };
  else k = { id, teil: "de", typ: "laut", art: anzeige.includes("|") ? "silbenwort" : "silbe", zeichen: anzeige.includes("|") ? anzeige : anzeige.toLowerCase(), stufe, woerter: [[bildwort, emoji || "🖼️"]], extra, eigen: true };
  if (alt) S.eigeneKarten = S.eigeneKarten.map((x) => (x.id === id ? k : x)); else S.eigeneKarten.push(k);
  if (formularFoto) { const key = id + "|0"; await DB.put(key, formularFoto); S.fotos[key] = true; fotoCacheLeeren(key); }
  speichere(); hinweis(alt ? "Karte geändert" : "Karte gespeichert");
  einstFilter.spiel = k.teil === "en" ? "en" : "abc"; filterZeichnen(); formularZeichnen(null); kartenlisteZeichnen();
}

/* ---------- Sichern & Wiederherstellen ---------- */
function blobZuDataURL(b) { return new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(b); }); }
async function dataURLZuBlob(u) { const r = await fetch(u); return r.blob(); }
async function exportieren() {
  const fotos = {};
  for (const { k, v } of await DB.alle()) { const d = await blobZuDataURL(v); if (d) fotos[k] = d; }
  const daten = { app: "einhorn-abc", version: 1, exportiert: new Date().toISOString(), zustand: S, fotos };
  const name = `einhorn-abc-sicherung-${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([JSON.stringify(daten)], { type: "application/json" });
  try {
    const datei = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [datei] })) { await navigator.share({ files: [datei], title: "Einhorn-ABC Sicherung" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  hinweis("Sicherung erstellt");
}
function importieren() {
  const inp = $("#datei-import"); inp.value = "";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let daten; try { daten = JSON.parse(await f.text()); } catch (e) { hinweis("Die Datei ist keine gültige Sicherung."); return; }
    if (!daten || daten.app !== "einhorn-abc" || !daten.zustand) { hinweis("Die Datei ist keine Einhorn-ABC-Sicherung."); return; }
    if (!(await frage("Sicherung laden? Alle aktuellen Daten auf diesem Gerät werden ersetzt.", "💾", false))) return;
    S = mischeZustand(standardZustand(), daten.zustand); zustandAktualisieren(daten.zustand); S.fotos = {};
    await DB.leeren(); fotoCacheLeeren();
    for (const [key, url] of Object.entries(daten.fotos || {})) { try { await DB.put(key, await dataURLZuBlob(url)); S.fotos[key] = true; } catch (e) { } }
    speichere(); einstellungenZeichnen(); hinweis("Sicherung geladen");
  };
  inp.click();
}

/* =====================================================================
   Testmodus (index.html?test) – zum Prüfen von Punkten und Berg
   ===================================================================== */
function testmodusEinrichten() {
  const k = document.createElement("button"); k.id = "test-knopf"; k.textContent = "🧪";
  const p = document.createElement("div"); p.id = "test-panel"; p.className = "versteckt";
  const knopf = (text, fn) => { const b = document.createElement("button"); b.className = "e-knopf"; b.textContent = text; b.onclick = () => { p.classList.add("versteckt"); fn(); }; p.appendChild(b); };
  p.innerHTML = "<b>Runde simulieren (Versuche):</b>";
  [10, 11, 12, 13, 14, 15, 16].forEach((v) => knopf(String(v), () => { R.aktiv = false; R.test = true; R.spiel = gewaehltesSpiel; belohnenUndBerg(ergebnisFuer(v), gewaehltesSpiel); }));
  const t = document.createElement("b"); t.textContent = "Sonstiges:"; p.appendChild(t);
  knopf("+10 Punkte", () => { R.test = true; belohnenUndBerg({ szene: "gold", platz: 1, punkte: 10 }, "abc"); });
  knopf("Alles löschen", async () => { speichernGesperrt = true; try { localStorage.removeItem(SPEICHER_SCHLUESSEL); } catch (e) { } await DB.leeren(); location.reload(); });
  k.onclick = () => p.classList.toggle("versteckt");
  $("#app").append(k, p);
}

/* =====================================================================
   Start
   ===================================================================== */
function init() {
  laden();
  Sprache.laden();
  Aufnahmen.laden();
  // Kein Gummiband-Scrollen und kein Zoomen
  document.addEventListener("touchmove", (e) => { if (!e.target.closest(".scroll")) e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", (e) => e.preventDefault());
  document.addEventListener("dblclick", (e) => e.preventDefault());
  // Audio/Sprache beim ersten Tipp freischalten (iOS). Auf dem Startbildschirm erklingt dabei
  // der Start-Jingle – iOS erlaubt Töne erst nach dem ersten Tipp.
  let harfeAuslassen = false;   // dieser Tipp hat schon den Start-Jingle ausgelöst
  document.addEventListener("pointerdown", () => {
    entsperren(); harfeAuslassen = false;
    if (!jingleGespielt && aktuellerScreen === "s-start") { startJingle(); harfeAuslassen = true; }
  }, true);
  // Menü-Knöpfe: dezente Harfentöne – oder, falls eingeschaltet, eine kurze Ansage
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-say], [data-harfe]");
    if (b) {
      if (S.knoepfeAnsagen && b.dataset.say) { Sprache.sprich(b.dataset.say); Ton.spiele("tipp"); }
      else if (!harfeAuslassen) Ton.harfenTupfer();
      harfeAuslassen = false;
      return;
    }
    if (e.target.closest("button:not([data-probe])")) Ton.spiele("tipp");
  }, true);
  $$("[data-home]").forEach((b) => b.addEventListener("click", nachHause));
  startEinrichten(); stufenwahlEinrichten(); rundeEinrichten(); bergEinrichten();
  $("#training-einhorn").innerHTML = einhornSVG("mit-training");
  let verstecktSeit = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { verstecktSeit = Date.now(); Sprache.stop(); Ton.musikStop(); speichere(); return; }
    if (S.musik && entsperrt) Ton.musikStart();
    // App nach längerer Pause wieder geöffnet: Start-Jingle (sofort oder beim nächsten Tipp)
    if (verstecktSeit && Date.now() - verstecktSeit > 20000 && aktuellerScreen === "s-start") { jingleGespielt = false; if (entsperrt) startJingle(); }
  });
  window.addEventListener("pagehide", speichere);
  if (TESTMODUS) testmodusEinrichten();
  if (!S.einhornName) introStart(); else { zeige("s-start"); startZeichnen(); }
  if (window.INHALT_HINWEISE && INHALT_HINWEISE.length) setTimeout(() => hinweis("⚠️ In einer Inhaltsdatei steckt ein Fehler – Details unter Einstellungen › Bibliothek.", 6000), 900);
  if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => { });
}
document.addEventListener("DOMContentLoaded", init);
</script>
